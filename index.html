<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164f43"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><title>Visual Timer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#171717;background:#f5f5f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,560px)}.dial{width:100%;display:block;touch-action:none}.status{text-align:center;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0 16px}.panel{background:white;border:1px solid #ddd;border-radius:18px;padding:16px;display:grid;gap:14px}.presets{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{min-height:46px;border:1px solid #ccc;border-radius:12px;background:#fff;padding:8px 14px;font-weight:700}.preset.active,.primary{background:#171717;color:#fff}.row{display:grid;grid-template-columns:1fr auto;gap:10px}.row input[type=number]{min-width:0;width:100%;min-height:46px;border:1px solid #ccc;border-radius:12px;padding:8px 12px;font-size:16px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.color{display:flex;align-items:center;gap:10px}.color input{width:50px;height:50px;border:0;background:none;padding:0}.color small{display:block;color:#666}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:52px}.hint{text-align:center;color:#666;font-size:.88rem}.running .panel{display:none}.running .status{font-size:1.7rem;margin-top:14px}.running .dial{max-height:78vh}@media(max-width:390px){body{padding:10px}.colors{grid-template-columns:1fr}}
</style></head><body><main class="app" id="app"><svg id="dial" class="dial" viewBox="0 0 600 600" aria-label="Visual countdown timer"><rect id="face" x="22" y="22" width="556" height="556" rx="58"/><circle id="base" cx="300" cy="300" r="218"/><path id="arc"/><g id="ticks"></g><g id="labels"></g><line id="hand" x1="300" y1="300" x2="300" y2="82" stroke-width="7" stroke-linecap="round"/><circle id="hubO" cx="300" cy="300" r="35"/><circle id="hubI" cx="300" cy="300" r="27"/></svg><div class="status" id="status">15:00 remaining</div><section class="panel"><div class="presets"><button class="preset" data-m="5">5 min</button><button class="preset" data-m="10">10 min</button><button class="preset active" data-m="15">15 min</button><button class="preset" data-m="30">30 min</button><button class="preset" data-m="45">45 min</button><button class="preset" data-m="60">60 min</button></div><div class="row"><input id="minutes" aria-label="Minutes" type="number" min="1" max="60" value="15"><button id="set">Set</button></div><div class="colors"><label class="color"><input id="remColor" type="color" value="#e4a467"><span>Time remaining<small>Countdown wedge</small></span></label><label class="color"><input id="elapsedColor" type="color" value="#164f43"><span>Time elapsed<small>Timer face</small></span></label></div><div class="actions"><button id="start" class="primary">Start</button><button id="reset">Reset</button></div><div class="hint">Tap or drag around the dial to set the time.</div></section></main><script>
(()=>{const app=document.querySelector('#app'),dial=document.querySelector('#dial'),ticks=document.querySelector('#ticks'),labels=document.querySelector('#labels'),arc=document.querySelector('#arc'),face=document.querySelector('#face'),base=document.querySelector('#base'),hand=document.querySelector('#hand'),hubO=document.querySelector('#hubO'),hubI=document.querySelector('#hubI'),status=document.querySelector('#status'),input=document.querySelector('#minutes'),start=document.querySelector('#start'),remC=document.querySelector('#remColor'),elC=document.querySelector('#elapsedColor');let duration=900,remaining=900,running=false,last=0,raf=0,wake=null,drag=false;const NS='http://www.w3.org/2000/svg';
const polar=(a,r=218)=>{a=(a-90)*Math.PI/180;return[300+r*Math.cos(a),300+r*Math.sin(a)]};const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const lum=h=>{let a=rgb(h).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4});return .2126*a[0]+.7152*a[1]+.0722*a[2]};const ink=h=>lum(h)>.38?'#111':'#fff';
function wedge(f){if(f<=0)return'';if(f>=.99999)return'M300 82 A218 218 0 1 1 299.99 82 Z';let e=f*360,p0=polar(0),p1=polar(e);return`M300 300 L${p0[0]} ${p0[1]} A218 218 0 ${e>180?1:0} 1 ${p1[0]} ${p1[1]} Z`}
for(let i=0;i<60;i++){let major=i%5===0,[x1,y1]=polar(i*6,major?194:202),[x2,y2]=polar(i*6,214),l=document.createElementNS(NS,'line');Object.entries({x1,y1,x2,y2,'stroke-width':major?5:3,'stroke-linecap':'round','data-a':i*6}).forEach(([k,v])=>l.setAttribute(k,v));l.classList.add('tick');ticks.append(l);if(major){let[tx,ty]=polar(i*6,169),t=document.createElementNS(NS,'text');Object.entries({x:tx,y:ty+10,'text-anchor':'middle','font-size':30,'font-weight':700,'font-family':'system-ui,sans-serif','data-a':i*6}).forEach(([k,v])=>t.setAttribute(k,v));t.textContent=i===0?'0':i;labels.append(t)}}
function save(){localStorage.setItem('visualTimer',JSON.stringify({m:duration/60,r:remC.value,e:elC.value}))}function render(){let f=duration?remaining/duration:0;face.setAttribute('fill',elC.value);base.setAttribute('fill',elC.value);arc.setAttribute('fill',remC.value);arc.setAttribute('d',wedge(f));let[hx,hy]=polar(f*360);hand.setAttribute('x2',hx);hand.setAttribute('y2',hy);document.querySelectorAll('[data-a]').forEach(n=>{let c=(+n.dataset.a<=f*360&&remaining>0)?ink(remC.value):ink(elC.value);n.setAttribute(n.tagName==='text'?'fill':'stroke',c)});let hi=f>.5?ink(remC.value):ink(elC.value);hand.setAttribute('stroke',hi);hubO.setAttribute('fill',hi);hubI.setAttribute('fill',f>.5?remC.value:elC.value);let s=Math.max(0,Math.ceil(remaining));status.textContent=remaining<=0?'Time’s up':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} remaining`}
async function acquireWake(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch{}}function releaseWake(){if(wake){wake.release().catch(()=>{});wake=null}}
function stop(){running=false;cancelAnimationFrame(raf);releaseWake();start.textContent=remaining<duration&&remaining>0?'Resume':'Start';app.classList.remove('running')}
function frame(t){if(!running)return;if(last)remaining-=Math.max(0,(t-last)/1000);last=t;if(remaining<=0){remaining=0;stop();render();if(navigator.vibrate)navigator.vibrate([250,120,250]);return}render();raf=requestAnimationFrame(frame)}
function setM(m){m=Math.max(1,Math.min(60,Math.round(+m||15)));stop();duration=remaining=m*60;input.value=m;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',+b.dataset.m===m));render();save()}
function setFromPoint(e){if(running)return;let r=dial.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width-300,y=(e.clientY-r.top)*600/r.height-300,a=(Math.atan2(y,x)*180/Math.PI+90+360)%360,m=Math.round(a/6);if(m===0)m=60;setM(m)}
dial.addEventListener('pointerdown',e=>{drag=true;dial.setPointerCapture(e.pointerId);setFromPoint(e)});dial.addEventListener('pointermove',e=>{if(drag)setFromPoint(e)});dial.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setM(b.dataset.m));document.querySelector('#set').onclick=()=>setM(input.value);document.querySelector('#reset').onclick=()=>{stop();remaining=duration;render()};start.onclick=async()=>{if(running){stop();return}if(remaining<=0)remaining=duration;running=true;last=0;start.textContent='Pause';app.classList.add('running');await acquireWake();raf=requestAnimationFrame(frame)};[remC,elC].forEach(c=>c.oninput=()=>{render();save()});
try{let s=JSON.parse(localStorage.getItem('visualTimer'));if(s){remC.value=s.r||remC.value;elC.value=s.e||elC.value;setM(s.m||15)}else render()}catch{render()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');})();
</script></body></html>
